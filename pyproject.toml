[project]
name = "late-ming-mechanism-lab"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "arviz>=1.3.0",
    "duckdb>=1.5.5",
    "geopandas>=1.1.4",
    "httpx>=0.28.1",
    "joblib>=1.6.0",
    "matplotlib>=3.11.2",
    "mesa[rec]>=3.5.1",
    "networkx[default]>=3.6.1",
    "numpy>=2.5.3",
    "openai>=3.13.0",
    "polars>=1.44.2",
    "pyarrow>=25.0.1",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pymc>=6.3.2",
    "pyproj>=3.8.0",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "salib>=1.5.2",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "shapely>=2.1.2",
    "tenacity>=9.1.4",
    "typer>=0.27.2",
]

[project.scripts]
late-ming-mechanism-lab = "late_ming_mechanism_lab:main"

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis>=6.168.0",
    "jupyterlab>=4.6.3",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.16.7",
]
