# Chinese translation of the V2.1 mechanism cards.
#
# Data, not code. This file holds the fields whose English changed in V2.1; every other field is
# resolved from `data/mechanisms/v2-zh.yaml` by `synthesis/v2_1.py`, and only when the English it
# translates is byte-identical to the V2 card's. A field that is in neither place, or whose English
# moved, is an error rather than an English fallback.
schema_version: mechanism-translations-v2_1
translation_version: zh-v2.1
language: zh
labels:
  title: "V2.1 机制卡索引"
  question: "问题"
  status: "状态"
  applies: "结论适用范围"
  sample: "样本语义"
  kind: "类型"
  independent_samples: "独立样本数"
  model_evidence: "模型证据（非历史事实）"
  record: "史料部分"
  support: "支持"
  challenge: "挑战"
  counterexample: "反例"
  falsifier: "可否证预测"
  uncertainty: "不确定性"
  lineage: "证据链（source → 规范化行 → 参数/规则 → 运行 → 统计量 → 卡片）"
  lineage_note: "证据链中的定位符与阶段名保留其原语言（路径、哈希与代码标识），以免与英文原稿不一致。"
  source_note: "英文原稿为准；模拟支持不等于历史真相。"
