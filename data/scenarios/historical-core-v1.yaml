# Declared by V2-P02; re-pinned by V2-P04.
#
# The pin moved once, in V2-P04, and the reason is recorded here rather than in a commit message:
# the price, relief and migration chains now record their own constraints as events
# (MARKET_CONSTRAINT, RELIEF_CONSTRAINT, MIGRATION_GATE), so the log is longer and its digest is
# different while the model's behaviour is not: every behavioural event count on the twelve
# counties is unchanged from the pre-instrumentation run, which the V2-P04 phase report records
# column by column. The values below are what the current code produces, and they are a
# reproducibility pin, not a fit target.
schema_version: demo-scenario-v1
id: historical-core-v1
description: >-
  The historical core: twelve selected Shaanxi-Henan county seats and two boundary exits on the
  CHGIS V6 administrative geography, the observed annual climate index built from REACHES events
  for 1625-1644, allocated across months by the declared seasonal profile, over the full 240-tick
  window. This is a run of the model on sourced inputs; it is not a historical reconstruction, and
  it is not a synthetic run.
label: historical-core-v1
seed: 20260912
ticks: 240
warmup_ticks: 24
sandbox:
  label: historical-core-v1
  dataset: historical-core-v1
  climate_mode: observed-historical
  allocation_mode: seasonal
  monthly_event_probability: 0.0
  severity_floor: 0.0
  nominal_pressure: 0.02
  pay_share_of_treasury: 0.5
  garrison_troops: 300.0
expected:
  simulation_digest: e856aa13b75c06646d5534a07578a95a3bec598ee4a32072e851e51baadd5e59
  event_count: 247110
  tick_count: 240
