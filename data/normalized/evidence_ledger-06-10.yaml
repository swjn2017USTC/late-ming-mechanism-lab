schema_version: evidence-ledger-v1
entries:
- id: land-debt-dual-register
  cluster: land_debt_elites
  assertion: 'The Mingshi states that the early Ming established dual registers: Yellow Registers (huangce)
    recording households, persons, property, and obligations, and Fish-scale Registers (yulin tuce) mapping
    land parcels for taxation.'
  interpretation: The model may treat the registered tax base as a reference quantity that can diverge
    from actual population and landholding over time.
  strength: form
  evidence_grade: B
  sources:
  - mingshi
  locators:
  - juan 77 (食貨一, household registration)
  supports_rules:
  - tax-collection
  notes: 'I confirmed the Mingshi describes the dual register system via search result text from ctext.org.
    I could not verify the exact juan number for all registration-related passages; juan 77 is the standard
    reference for huangce. Query: 明史 食货一 黄册 鱼鳞图册. Citations to sources whose records are unverified were
    removed from this claim, because they cannot carry a claim graded above what was checked: local-gazetteers.'
- id: land-debt-burden-shift
  cluster: land_debt_elites
  assertion: The Mingshi records that by the Jiajing period, registered households and tax land had declined
    substantially from the Hongwu baseline. Liang Fangzhong's compiled statistics confirm the registered
    population dropped from approximately 60.5 million (Hongwu 26) to approximately 50.9 million (Hongzhi
    15).
  interpretation: The decline in registered figures is generally understood as reflecting tax evasion
    and registration decay rather than actual population loss. The model may allow the taxable base to
    erode relative to actual population.
  strength: direction
  evidence_grade: B
  sources:
  - mingshi
  - liang-fangzhong-1980
  - ray-huang-1974
  locators:
  - juan 78 (食貨二, tax registers)
  - Ming tables in Part B (乙編)
  - chapters on fiscal organization
  supports_parameters:
  - FiscalParameters.elite_hidden_land_share
  - EliteParameters.max_lending_share_of_silver
  supports_rules:
  - tax-collection
  notes: 'The Jiajing-period decline figures were quoted in search results from gushiwen.cn. Liang''s
    Hongzhi 15 figure (~50.9M) was confirmed via multiple academic references. I could not verify the
    exact passage location for all figures. Query: 明史 户口 田地 嘉靖 衰减, 梁方仲 明代人口 统计.'
- id: land-debt-credit-relations
  cluster: land_debt_elites
  assertion: Huang documents that in North China, elite families served as creditors to smallholders,
    acquiring land through foreclosure when borrowers defaulted, and that this process intensified during
    periods of economic stress.
  interpretation: The model may include land transfer from smallholders to elites through debt foreclosure
    as a mechanism of concentration, with elites accumulating land when households face harvest failures.
  strength: context
  evidence_grade: B
  sources:
  - huang-1985
  locators:
  - chapters on land tenure and credit relations
  supports_parameters:
  - EliteParameters.land_purchase_price_tael_per_mu
  - EliteParameters.interest_rate_monthly
  - EliteParameters.loan_to_value
  supports_rules:
  - tax-collection
  notes: 'Huang''s argument about credit and land tenure is widely cited. I confirmed the book exists
    and covers North China via Google Books. I could not verify specific page references for the credit-foreclosure
    claim. Query: ''Huang peasant economy credit land foreclosure North China''. Citations to sources
    whose records are unverified were removed from this claim, because they cannot carry a claim graded
    above what was checked: local-gazetteers.'
- id: tax-quota-structure
  cluster: taxation_levies
  assertion: The Mingshi states that the Ming land levy was divided into summer tax (xia shui) and autumn
    grain (qiu liang). The Jiajing-period national quota was approximately 4.7 million shi of wheat for
    summer tax and approximately 24.7 million shi of rice for autumn grain.
  interpretation: The model may use these quota categories and their approximate magnitudes as reference
    values for the formal tax assessment.
  strength: magnitude
  evidence_grade: B
  sources:
  - mingshi
  - liang-fangzhong-1980
  locators:
  - juan 78 (食貨二, tax categories and quotas)
  - Ming tables in Part B (乙編)
  supports_parameters:
  - FiscalParameters.assessed_value_tael_per_mu
  supports_rules:
  - tax-collection
  notes: 'The summer tax (~4.7M shi) and autumn grain (~24.7M shi) figures were quoted in search results
    from gushiwen.cn. I could not confirm these are the exact Jiajing figures without reading the full
    chapter. Query: 明史 食货志 夏税 秋粮 石 额.'
- id: tax-single-whip-reform
  cluster: taxation_levies
  assertion: 'The Mingshi defines the single-whip reform (yitiaobian fa) as comprehensively combining
    a prefecture or county''s taxes and services: land and adult males were taken as the basis of calculation,
    and all tax and labor obligations were delivered to the government in a unified assessment.'
  interpretation: The model may treat the tax system as consolidating multiple obligations into a single
    silver-denominated assessment, with the assessment calculated from land area and registered adult
    males.
  strength: form
  evidence_grade: B
  sources:
  - mingshi
  - ray-huang-chc8
  locators:
  - juan 78 (食貨二, single-whip reform definition)
  - ch. 2, pp. 106-171 (fiscal administration)
  supports_parameters:
  - FiscalParameters.assessed_value_tael_per_mu
  supports_rules:
  - tax-collection
  notes: 'The Mingshi passage defining the single-whip reform was confirmed in search results from gushiwen.cn.
    I verified the chapter exists. Query: 明史 食货二 一条鞭法 定义.'
- id: tax-quota-decline
  cluster: taxation_levies
  assertion: The Mingshi records that by the Jiajing period, the summer-tax wheat quota had declined by
    approximately 900,000 shi and the autumn-rice quota by more than 2.5 million shi compared with the
    early Ming baseline.
  interpretation: The formal tax assessment eroded over time as the registration system decayed. The model
    may allow the effective tax yield to fall below the nominal quota.
  strength: magnitude
  evidence_grade: B
  sources:
  - mingshi
  - liang-fangzhong-1980
  locators:
  - juan 78 (食貨二, quota decline discussion)
  - Ming tables in Part B (乙編)
  supports_parameters:
  - FiscalParameters.assessed_value_tael_per_mu
  supports_rules:
  - tax-collection
  notes: 'The ~900,000 shi and >2.5M shi decline figures were quoted in search results from gushiwen.cn.
    I could not verify the exact baseline year for the comparison. Query: 明史 食货志 嘉靖 粮额 减少.'
- id: relief-granary-system
  cluster: relief
  assertion: The Mingshi describes the Ming operating a layered granary system including yubeicang (preparedness
    granaries) at prefectural and county levels for disaster relief, changpingcang (ever-normal granaries)
    for price regulation, shecang (community granaries) for village-level mutual aid, and yicang (charity
    granaries).
  interpretation: The model may distinguish between state-administered and community-managed granary institutions,
    each with distinct funding sources and relief functions.
  strength: form
  evidence_grade: B
  sources:
  - mingshi
  locators:
  - juan 80 (食貨三, granary system)
  supports_parameters:
  - FiscalParameters.granary_target_cover_months
  - EliteParameters.relief_carry_over_ratio_of_local_need
  supports_rules:
  - official-relief
  notes: 'The Mingshi chapter on granaries (食貨三) was confirmed on ctext.org. I found search results describing
    the yubeicang system. I could not read the full chapter to verify all four granary types are described
    there. Query: 明史 食货三 预备仓 常平仓 社仓 义仓. Citations to sources whose records are unverified were removed
    from this claim, because they cannot carry a claim graded above what was checked: local-gazetteers.'
- id: relief-distribution-modes
  cluster: relief
  assertion: 'The Mingshi indicates that Ming relief operated through multiple modes: free grain distribution
    in severe famine, spring grain loans repaid after harvest in moderate cases, and grain sales at reduced
    prices (pingtiao) for market stabilization.'
  interpretation: The model may include distinct relief distribution channels with different fiscal costs
    and recovery rates.
  strength: form
  evidence_grade: B
  sources:
  - mingshi
  - ray-huang-chc8
  locators:
  - juan 80 (食貨三, relief methods)
  - ch. 2, pp. 106-171 (fiscal administration)
  supports_parameters:
  - FiscalParameters.relief_share_of_need
  - EliteParameters.relief_share_of_grain_stock
  supports_rules:
  - official-relief
  notes: 'The three-mode relief system is standard in Ming institutional descriptions. I found search
    results confirming the Mingshi describes relief mechanisms. I could not verify specific passages for
    each mode. Query: 明史 赈济 放赈 春借秋还 平粜.'
- id: relief-community-funding
  cluster: relief
  assertion: The Mingshi preserves a memorial stating that community granaries (shecang) were filled through
    contributions from the local population, and that wealth stored among the people was understood as
    wealth stored within the state.
  interpretation: The model may distinguish between state-funded relief (from official granaries) and
    community-funded relief (from shecang), with different eligibility and capacity constraints.
  strength: form
  evidence_grade: B
  sources:
  - mingshi
  locators:
  - 列傳 or 誌 chapters (memorial on community granaries)
  supports_parameters:
  - EliteParameters.relief_eligibility_unmet_ratio
  - EliteParameters.relief_share_of_grain_stock
  supports_rules:
  - official-relief
  notes: 'I found a search result quoting a Mingshi memorial (列傳第一百二) that distinguishes state and community
    granary funding. I could not verify the exact juan for this passage. Query: 明史 列传 社仓 民间 财谷. Citations
    to sources whose records are unverified were removed from this claim, because they cannot carry a
    claim graded above what was checked: local-gazetteers.'
- id: mil-finance-treasury-share
  cluster: military_finance
  assertion: Ray Huang reports that from the 1580s to the 1640s, military expenditures consumed approximately
    53 to 85 percent of the silver in the Taicang (Imperial) Treasury, with some years reaching approximately
    97 percent.
  interpretation: The model may use the military's share of central treasury silver as a parameter for
    fiscal allocation between military and civilian expenditure.
  strength: magnitude
  evidence_grade: A
  sources:
  - ray-huang-chc8
  - ray-huang-1970
  locators:
  - ch. 2, pp. 106-171 (fiscal administration)
  - pp. 39-62 (military expenditures)
  supports_parameters:
  - MilitaryParameters.pay_share_of_treasury
  supports_rules:
  - military-finance
  notes: 'The 53-85% and ~97% figures were found in search results citing Ray Huang''s CHC chapter. I
    verified both sources exist but did not read the specific pages. Query: ''Ray Huang military expenditure
    Taicang treasury percentage Ming''.'
- id: mil-finance-frontier-grain
  cluster: military_finance
  assertion: Ray Huang estimates that during the late 15th and early 16th centuries, approximately 75
    to 90 percent of the grain consumed on the northern frontier came from interior sources rather than
    local military colony production.
  interpretation: The model may treat frontier garrisons as structurally dependent on transported grain,
    with local production covering only a minority of needs.
  strength: magnitude
  evidence_grade: A
  sources:
  - ray-huang-chc8
  - ray-huang-1974
  locators:
  - ch. 2, pp. 106-171 (frontier grain supply)
  - chapters on grain transport and salt certificates
  supports_parameters:
  - MilitaryParameters.food_shi_per_soldier_month
  - MilitaryParameters.ration_purchase_share_of_silver
  supports_rules:
  - military-finance
  notes: 'The 75-90% figure was found in search results citing CHC vol 8. I verified the sources exist
    but could not verify the exact basis for this estimate. Query: ''Ming northern frontier grain import
    interior percentage juntun''.'
- id: mil-finance-grain-to-silver
  cluster: military_finance
  assertion: Ray Huang documents that by the later 16th century, the Ming increasingly sent silver to
    frontier garrisons instead of transporting grain in kind, making soldiers dependent on functioning
    local markets for food procurement.
  interpretation: The model may include a parameter for the share of military provisions purchased on
    the market versus transported in kind, capturing the monetization of military finance.
  strength: direction
  evidence_grade: A
  sources:
  - ray-huang-1970
  - ray-huang-chc8
  - lorge-2005
  locators:
  - pp. 39-62 (military expenditures)
  - ch. 2, pp. 106-171 (silver substitution)
  - chapters on Ming military institutions
  supports_parameters:
  - MilitaryParameters.pay_tael_per_soldier_month
  - MilitaryParameters.ration_purchase_share_of_silver
  supports_rules:
  - military-finance
  notes: 'The grain-to-silver transition is a central argument in Ray Huang''s work. I confirmed both
    sources cover this topic via search results. I could not verify specific dates for the transition.
    Query: ''Ming military silver remittance grain transport shift monetization''.'
- id: rebel-li-shanhaiguan-size
  cluster: rebellion_armed_groups
  assertion: Lorge states that Li Zicheng arrayed approximately 60,000 men at the Battle of Shanhaiguan
    in May 1644. Wakeman gives a similar estimate, while Mote suggests more than 100,000.
  interpretation: The model may use a range of approximately 60,000 to 100,000 for the size of Li Zicheng's
    effective field army at its peak, recognizing scholarly disagreement.
  strength: magnitude
  evidence_grade: B
  sources:
  - lorge-2005
  - wakeman-1985
  - mote-1999
  locators:
  - discussions of Battle of Shanhaiguan
  - discussions of Shanhaiguan campaign
  - p. 816 (estimated troop figures)
  supports_parameters:
  - BandParameters.minimum_formation_troops
  - BandParameters.split_troops_threshold
  supports_rules:
  - band-formation
  notes: 'The ~60,000 figure (Lorge, Wakeman) and >100,000 (Mote) were found in search results quoting
    these works. Early Qing sources give much larger figures (200,000+) that scholars generally treat
    as inflated. I could not verify exact page numbers. Query: ''Li Zicheng army size Shanhaiguan Lorge
    Wakeman Mote''.'
- id: rebel-multiple-bands
  cluster: rebellion_armed_groups
  assertion: The late Ming rebellion involved multiple independent bands. By the early 1630s, more than
    thirty-six separate rebel bands were reportedly operating across Shaanxi and Shanxi provinces.
  interpretation: The model may represent the rebellion as a collection of multiple bands rather than
    a single unified army, with each band having its own recruitment and raiding patterns.
  strength: magnitude
  evidence_grade: C
  sources:
  - lorge-2005
  - wakeman-1985
  locators:
  - discussions of rebel organization
  - discussions of rebel movements in Shaanxi and Shanxi
  supports_parameters:
  - BandParameters.minimum_formation_troops
  - BandParameters.formation_unmet_ratio
  supports_rules:
  - band-formation
  notes: 'The ~36 bands figure was found in a search result but I could not identify the primary source
    for this specific count. The general pattern of multiple bands is well established in the scholarly
    literature. Query: ''late Ming rebel bands Shaanxi Shanxi number 1630s''.'
- id: rebel-army-absorption
  cluster: rebellion_armed_groups
  assertion: Lorge documents that rebel leaders, including Li Zicheng, expanded their forces by absorbing
    other rebel bands, surrendered Ming soldiers, and famine refugees, making their armies organizationally
    fluid.
  interpretation: 'The model may include band recruitment from multiple sources: famine refugees, surrendered
    government troops, and merger with other bands, with recruitment rates varying with crisis severity.'
  strength: direction
  evidence_grade: B
  sources:
  - lorge-2005
  - mingshi
  locators:
  - discussions of rebel army composition and growth
  - 兵志 (military treatise, late Ming rebel movements)
  supports_parameters:
  - BandParameters.recruitment_rate_of_eligible_adults
  - BandParameters.cohesion_gain_per_month
  supports_rules:
  - band-formation
  notes: 'The pattern of rebel absorption is documented across multiple scholarly sources. I confirmed
    Lorge discusses this via search results. The Mingshi military treatise describes late Ming rebel movements.
    I could not verify specific page references. Query: ''Li Zicheng rebel army absorption refugees surrendered
    Ming Lorge''.'
