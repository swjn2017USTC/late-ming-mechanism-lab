- id: garrison_target_troops
  name: garrison target troops
  parameter_set: MilitaryParameters
  definition: the garrison strength the levy tries to maintain
  unit: soldiers per node
  mechanism: military finance, desertion, suppression
  level: meso
  support_class: theoretically-assumed
  evidence_grade: S
  central: 300.0
  central_text: null
  sources: []
  reasoning: A claim size has to exist for the levy rule; it is set at the toy scale, not from a garrison
    roster.
  uncertainty: Actual garrison strengths are exactly what the archive would give and the registry does
    not hold one.
  sensitivity_priority: high
  version: military-parameters-v1 (P06 (phase 10-14))
