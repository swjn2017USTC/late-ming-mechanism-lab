- id: suppression_effectiveness
  name: suppression effectiveness
  parameter_set: MilitaryParameters
  definition: members a garrison can remove from a band per month per soldier, before discounts
  unit: members per soldier per month
  mechanism: military finance, desertion, suppression
  level: meso
  support_class: exploratory
  evidence_grade: S
  central: 0.02
  central_text: null
  sources: []
  reasoning: Suppression worked sometimes and failed often; the model needs a rate and uses a declared
    one.
  uncertainty: This parameter governs how long a band survives contact with the army and nothing in the
    registry constrains it.
  sensitivity_priority: high
  version: military-parameters-v1 (P06 (phase 10-14))
- id: suppression_arms_mitigation
  name: suppression arms mitigation
  parameter_set: MilitaryParameters
  definition: share of suppression losses a fully armed band avoids
  unit: share of losses avoided (0-1)
  mechanism: military finance, desertion, suppression
  level: meso
  support_class: exploratory
  evidence_grade: S
  central: 0.5
  central_text: null
  sources: []
  reasoning: Equipment mattered; the size of the effect is declared.
  uncertainty: No source quantifies the effect of arms on casualties in this setting.
  sensitivity_priority: medium
  version: military-parameters-v1 (P06 (phase 10-14))
