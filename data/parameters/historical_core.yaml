schema_version: parameter-cards-v1
parameter_set: HistoricalCoreParameters
cards:
- id: drought_weight
  name: drought weight in the annual index
  parameter_set: HistoricalCoreParameters
  definition: weight of a recorded drought event in the annual severity index, before saturation
  unit: index points per event
  mechanism: historical core observed forcing (annual index)
  level: meso
  support_class: theoretically-assumed
  evidence_grade: S
  central: 1.0
  central_text: null
  sources: []
  reasoning: >-
    A recorded drought is the most direct documentary signal of the agricultural condition the
    model's climate forcing represents, so it carries full weight; the other categories are scaled
    below it. The ordering is argued, the magnitude is not.
  uncertainty: >-
    Nothing in the registry says how many recorded drought events correspond to what the model calls
    severity 1. The weight sets the units of the index, and V2-P03 must not treat the resulting
    number as an observation of intensity.
  sensitivity_priority: high
  version: historical-core-parameters-v1 (V2-P02)
  range:
    low: 0.5
    high: 1.0
    basis: declared band; the ordering drought >= famine >= crop >= pest is what is argued
    conflicts: ''
  ledger_entries:
  - drought-north-china-pattern

- id: famine_weight
  name: famine weight in the annual index
  parameter_set: HistoricalCoreParameters
  definition: weight of a recorded famine event in the annual severity index, before saturation
  unit: index points per event
  mechanism: historical core observed forcing (annual index)
  level: meso
  support_class: theoretically-assumed
  evidence_grade: S
  central: 0.75
  central_text: null
  sources: []
  reasoning: >-
    Famine is a social outcome that follows crop failure, so it is weighted below drought: counting
    a famine twice - once as its own event, once as the drought that caused it - would double-count
    the same bad year.
  uncertainty: >-
    The dependency between drought and famine events in the same record is not measured, so the
    weight is a declared discount rather than an estimated correction.
  sensitivity_priority: high
  version: historical-core-parameters-v1 (V2-P02)
  range:
    low: 0.4
    high: 1.0
    basis: declared band around the current value
    conflicts: ''
  ledger_entries:
  - famine-drought-famine-sequence

- id: crop_weight
  name: crop-failure weight in the annual index
  parameter_set: HistoricalCoreParameters
  definition: weight of a recorded crop event in the annual severity index, before saturation
  unit: index points per event
  mechanism: historical core observed forcing (annual index)
  level: meso
  support_class: theoretically-assumed
  evidence_grade: S
  central: 0.5
  central_text: null
  sources: []
  reasoning: >-
    A crop-failure entry is a direct statement about the harvest, but the category also collects
    entries about particular crops rather than the whole season, so it is weighted below famine.
  uncertainty: The category's subcategories are heterogeneous; nothing measures their severity.
  sensitivity_priority: medium
  version: historical-core-parameters-v1 (V2-P02)
  range:
    low: 0.2
    high: 0.8
    basis: declared band around the current value
    conflicts: ''
  ledger_entries: []

- id: pest_weight
  name: pest weight in the annual index
  parameter_set: HistoricalCoreParameters
  definition: weight of a recorded pest or vermin event in the annual severity index
  unit: index points per event
  mechanism: historical core observed forcing (annual index)
  level: meso
  support_class: theoretically-assumed
  evidence_grade: S
  central: 0.4
  central_text: null
  sources: []
  reasoning: >-
    Locust outbreaks are an agricultural shock in their own right and are recorded as such, but they
    are a partial-season hazard rather than a whole-year condition.
  uncertainty: The record does not separate locust years from other pest entries.
  sensitivity_priority: medium
  version: historical-core-parameters-v1 (V2-P02)
  range:
    low: 0.1
    high: 0.6
    basis: declared band around the current value
    conflicts: ''
  ledger_entries:
  - famine-drought-famine-sequence

- id: drought_saturation_events
  name: drought events at saturation
  parameter_set: HistoricalCoreParameters
  definition: number of drought events in a node-year at which the drought contribution reaches its weight
  unit: events per node-year
  mechanism: historical core observed forcing (annual index)
  level: meso
  support_class: theoretically-assumed
  evidence_grade: S
  central: 6.0
  central_text: null
  sources: []
  reasoning: >-
    The index has to saturate somewhere or a heavily documented node dominates the map; six events
    in one county-year is the point chosen, and it is a declaration.
  uncertainty: >-
    The count of recorded events per node-year depends on how many documents happen to survive for
    that place, so saturation mixes climate with documentation density.
  sensitivity_priority: high
  version: historical-core-parameters-v1 (V2-P02)
  range:
    low: 3.0
    high: 12.0
    basis: declared band around the current value
    conflicts: ''
  ledger_entries: []

