- id: monthly_allocation_profile
  name: monthly allocation profile
  parameter_set: HistoricalCoreParameters
  definition: >-
    how the annual index is distributed across the twelve months, as normalised weights over the
    recorded months of the drought, famine, crop and pest events
  unit: share of the annual total, by month
  mechanism: historical core annual-to-monthly allocator
  level: meso
  support_class: evidence-backed
  evidence_grade: C
  central: null
  central_text: >-
    1=0.0066, 2=0.1679, 3=0.0104, 4=0.0104, 5=0.2581, 6=0.0607, 7=0.1167, 8=0.2865, 9=0.0256,
    10=0.0085, 11=0.0465, 12=0.0019
  sources:
  - reaches-noaa
  reasoning: >-
    The profile is computed, not chosen: it is the normalised monthly distribution of the 1,054
    drought, famine, crop and pest events the REACHES file records with a Gregorian month inside the
    core window. It is the only part of the allocator that rests on the record rather than on a
    declaration.
  uncertainty: >-
    What is recorded is not what happened: documentation density varies by month and by place, and a
    month with a harvest failure may be entered under the month the memorial was filed. The profile
    is a documented seasonality, not a measured one, and V2-P03 must treat the allocator as an
    explicit, ablatable construction rather than as monthly observation.
  sensitivity_priority: high
  version: historical-core-parameters-v1 (V2-P02)
  range:
    low: null
    high: null
    basis: >-
      no range: the profile is a twelve-value distribution, so a scalar band would not be the value
      the model runs; V2-P07 should sweep it as a whole, and the uniform allocation is the ablation
      that removes it
    conflicts: ''
  ledger_entries:
  - drought-north-china-pattern
  - famine-worst-years

