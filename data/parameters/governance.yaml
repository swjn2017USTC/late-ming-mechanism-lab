schema_version: parameter-cards-v1
parameter_set: GovernanceIndicatorParameters
cards:
- id: receipts_below_quota_share
  name: receipts below quota share
  parameter_set: GovernanceIndicatorParameters
  definition: receipts against the assessed quota below which the indicator reads as a warning
  unit: receipts over quota (0-1)
  mechanism: governance warning indicators (reading rules)
  level: macro
  support_class: exploratory
  evidence_grade: S
  central: 0.5
  central_text: null
  sources: []
  reasoning: A reading line for a report, not a mechanism value; the plan forbids collapsing governance
    into a score, so the line is stated and the count of crossed lines is reported.
  uncertainty: The line is a reader's choice; the report prints it beside the measurement.
  sensitivity_priority: low
  version: governance-indicators-v1 (P07 (reporting only))
