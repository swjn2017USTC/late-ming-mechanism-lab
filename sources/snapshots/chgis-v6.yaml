schema_version: source-snapshot-v1
note: 'CHGIS Version 6 (2016), the administrative-geography spine V2-P02 will build the historical core on. The
  licence is the governing document here: academic use is free, redistribution is not. Every raw file was downloaded
  from the official Harvard Dataverse distribution into data/raw/private/chgis-v6/, which git ignores; what this
  repository keeps is the record, the rule and (from V2-P02 on) derived tables that carry the mandatory citation.'
