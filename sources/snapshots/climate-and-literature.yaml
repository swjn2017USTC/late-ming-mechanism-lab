    statement: '"This work is distributed under the Creative Commons Attribution 4.0 License." Copyright remains
      with the authors; attribution is required.'
    basis: Article landing page, opened 2026-09-14 (copyright line and site licence footer)
    checked_utc: 2026-09-14
  acquisition:
    method: http
    acquired: true
    fetch_url: https://cp.copernicus.org/articles/20/2287/2024/cp-20-2287-2024.pdf
    acquired_utc: 2026-09-14
    tool: curl -sSL https://cp.copernicus.org/articles/20/2287/2024/cp-20-2287-2024.pdf
    bytes: 11177235
    sha256: 042cc6303896566325087c193c58180dc4c9e9e6f5f83523e2717cf8b3d3b284
    local_path: data/raw/private/chen-2024/cp-20-2287-2024.pdf
  derived_output_rule: CC BY 4.0 permits redistribution and adaptation with attribution, so the file could be committed;
    it is kept local by policy, because the repository publishes derived tables rather than third-party files. Derived
    tables must cite Chen, S., Su, Y., Chen, X., and Yang, L. E., Clim. Past 20, 2287-2307 (2024).
  derived_committed: []
  verification:
    opened_utc: 2026-09-14
    what_confirmed: The landing page confirms title, authors, volume 20, pages 2287-2307, publication date 2024-10-11
      and the CC BY 4.0 licence, and states in its data-availability section that "All the data used in this study
      are described in Appendix A" - so the county-level reconstruction lives in this PDF and has no separate dataset
      DOI.
    read_depth: abstract
  notes: Appendix A is the data. P02 must extract it from the PDF rather than look for a dataset, and must record
    the article's spatial resolution as a claim about the appendix, not about a county polygon layer.
