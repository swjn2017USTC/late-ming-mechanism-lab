    access: library
    language: en
    grade: C
    verification: unverified
    rights_note: "Paywalled; available through a university library subscription. No page opened."
    notes: >-
      DOI confirmed via Springer (vol. 127 no. 2, pp. 169-182). Abstract read: combines dry-wet and
      temperature reconstructions with disaster records, grain production, rice prices and rebellion
      data, and reports a per-capita production decline of roughly 20-50 per cent. No page opened.

