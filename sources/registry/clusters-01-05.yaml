schema_version: source-registry-v1
note: >-
  Sources for the drought/climate, famine, agriculture, population/migration and grain-price
  clusters. `ming-shilu` is registered once, here, with both the print and the digital edition
  described, because both halves of this phase cited the same work.
sources:
  - id: ming-shilu
    layer: primary
    clusters: [drought_climate, famine, grain_market_prices, land_debt_elites, taxation_levies, relief, rebellion_armed_groups]
    title: "明實錄 (Veritable Records of the Ming), Chongzhen reign"
    creators: []
    year: null
    container: "Court-compiled daily records; Zhonghua Shuju edition (1962-1984); digitized by Academia Sinica, Institute of History and Philology"
    locator: "Zhonghua Shuju print, Chongzhen juan 1-17; digital edition at mh.sinica.edu.tw/tyml/"
    access: institution
    language: zh
    grade: C
    verification: unverified
    rights_note: >-
      Print edition available in major research libraries; the Academia Sinica digital edition may
      require institutional access. No individual Chongzhen-reign entry was opened during this
      phase, and no file was acquired.
    notes: >-
      The principal primary source for the period: drought memorials, famine reports, price
      observations, relief edicts and military-pay memorials. Recorded from two independent
      bibliographic descriptions (Zhonghua Shuju edition; Academia Sinica digital edition); no page
      was opened. Queries: 'Ming Shilu Chongzhen drought records', '明實錄 崇禎 旱災',
      'Ming Shilu veritable records Academia Sinica digital'.

  - id: zheng-2006-precip
    layer: dataset
    clusters: [drought_climate]
    title: "Precipitation Variability and Extreme Events in Eastern China during the Past 1500 Years"
    creators: [Zheng, Jingyun, Wang, Wei-Chyung, Ge, Quansheng, Man, Zhumao, Zhang, Puyu]
    year: 2006
    container: "Terrestrial, Atmospheric and Oceanic Sciences"
    locator: "10.3319/TAO.2006.17.3.579(A)"
    access: open-access-journal
    language: en
    grade: B
    verification: verified
    verified_against: "DOI resolved via tao.cgu.org.tw; landing page confirmed title, authors, vol. 17 no. 3 pp. 579-592; abstract read"
    rights_note: ""
    notes: >-
      Reconstructed dry-wet index for eastern China, 501-2000 CE. The most severe drought event in
      the reconstruction is identified as 1634-1644. Full text not opened (403 on direct access), so
      no numeric index value for 1628-1644 was taken.

  - id: chen-2024-chongzhen
    layer: dataset
    clusters: [drought_climate, famine]
    title: "The spatio-temporal evolution of the Chongzhen drought (1627-1644) in China and its impact on famine"
    creators: [Chen, Shulong, Su, Yang, Chen, Xingcan, Yang, Lianmei E.]
    year: 2024
    container: "Climate of the Past"
    locator: "10.5194/cp-20-2287-2024"
    access: open-access-journal
    language: en
    grade: B
    verification: verified
    verified_against: "DOI resolved via Copernicus; landing page confirmed title, authors, vol. 20 pp. 2287-2307; abstract and data-availability statement read"
    rights_note: ""
    notes: >-
      County-level reconstruction compiled from 6,282 merged disaster records (1,802 drought, 1,977
      famine) drawn from 24 historical document collections; data in the article's appendix, no
      separate dataset DOI. Full PDF not opened, so no county-level severity value was taken.

  - id: brook-2017-nine-sloughs
    layer: modern_scholarship
    clusters: [drought_climate, famine, agriculture]
    title: "Nine Sloughs: Profiling the Climate History of the Yuan and Ming Dynasties, 1260-1644"
    creators: [Brook, Timothy]
    year: 2017
    container: "Journal of Chinese History"
    locator: "10.1017/jch.2016.25"
    access: library
    language: en
    grade: C
    verification: unverified
    rights_note: "Paywalled; available through a university library subscription. No page opened."
    notes: >-
      DOI confirmed via Cambridge Core (vol. 1 no. 1, pp. 27-58, January 2017); abstract describes
      nine multi-year stress periods including the Chongzhen slough 1628-1644 and a corpus of 553
      famine-price observations from about 3,000 gazetteers. Those figures come from the abstract
      and from secondary citations, not from the pages. Query: 'Brook nine sloughs DOI Cambridge'.

  - id: chen-2020-megadrought
    layer: modern_scholarship
    clusters: [drought_climate]
    title: "One Drought and One Volcanic Eruption Influenced the History of China: The Late Ming Dynasty Mega-drought"
    creators: [Chen, Feng, Li, Jinbao, Liu, Yafeng, Zhang, Xing, Huang, Rui, Huang, Chenxi, Zhang, Tongwen, Gu, Weixi, Zhang, Zhiqiang]
    year: 2020
    container: "Geophysical Research Letters"
    locator: "10.1029/2020GL088124"
    access: library
    language: en
    grade: C
    verification: unverified
    rights_note: "Paywalled; available through a university library subscription. No page opened."
    notes: >-
      DOI confirmed via Wiley (vol. 47, 2020). Abstract read: identifies a 1637-1643 megadrought and
      argues for volcanic forcing via a 1641 eruption. No page of the article was opened.

  - id: zheng-2014-collapse
    layer: modern_scholarship
    clusters: [famine, grain_market_prices]
    title: "How climate change impacted the collapse of the Ming dynasty"
    creators: [Zheng, Jingyun, Xiao, Lingbo, Fang, Xiuqi, Hao, Zhixin, Ge, Quansheng, Li, Beibei]
    year: 2014
    container: "Climatic Change"
