- id: M004
  name: Elite Mediation Bifurcation
  question: 精英要么中介家户的困顿、要么累积抵押物，而所走的那一支是否决定了县的轨迹？
  status: WEAK
  micro_conditions:
  - 面对消费缺口的家户可以按月度利率以其土地借入白银，前提是它有土地可作抵押。
  - 借贷是家户不必离开就能有饭吃的方式，因此信贷渠道位于困顿与迁出之间。
  meso_conditions:
  - 精英的放贷能力是作为抵押物的土地的一个份额，因此同一条让家户得以存活的规则，会在它无力偿还时把土地转移走。
  - 精英田产有一部分是在登记册之外评估的：一个声明比例的精英土地被隐匿、不予课税。
  causal_chain:
  - 困顿迫使家户变卖或借贷，而贷款价值比规则决定了精英会放出多少白银。
  - 这些白银被消费掉而非用于投资，因此即便家户熬过了这个月，其资产状况也在变弱。
  - 土地向放贷者转移，县的可评估税基随之收缩。
  trigger: 一个大到使家户以土地抵押来填补的消费缺口；当信贷渠道关闭时，同样的缺口只能靠迁出来应对。
  macro_outcome: 一个收缩的可评估税基，土地集中在精英手中。其中介的那一面是被测量过的、且是承重的；而分叉——两条轨迹不同的分支——从未被测量，且运行显示这两面是一起出现的。
  conditions:
  - statement: 一个有能力以抵押土地放出白银的放贷者。
    level: meso
    role: necessary
  - statement: 一个有土地可抵押、且有缺口无法填补的家户。
    level: micro
    role: necessary
  - statement: 一个未改革的登记册，使精英土地可以躲开评估。
    level: meso
    role: facilitating
  time_lag: 未解决：信贷实验臂是按运行末期的水平比较的，没有任何产物记录某个家户群组首次借贷或首次失去土地的月份。先于借贷的消费事件是按月发生的，因此时滞至多为一次运行。
  sensitivity_evidence: elite_hidden_land_share 在 P09 中已辨识——中位数 0.359，收缩 0.277——interest_rate_monthly
    也已辨识（中位数 0.070，收缩 0.368），因此信贷关系的两项都由证据钉住，而不是任其自由。两者都不在越线计数上三个最大的基本效应之列，因此这条渠道对水平的影响大于对崩溃边界的影响。
  ablation_evidence: 关闭信贷渠道会加深税基收缩并把家户推出去：tax_base_change_mu -9,539.98 [-12,523.40, -7,849.88]，下降；households_departed
    +121.18 [+91.79, +400.50]，上升。精英放贷从每次运行 74.5 降到 0.0，而对武装人口的影响未定（largest_band_share_max +0.00 [-0.01,
    +0.10]，未定）：在这里承重的是中介的那一支，而累积的那一支没有实验臂去移除。
  hold_out_evidence: 没有任何留出模式对信贷渠道评分：debt-transfers-land 是一个校准目标，在 0.94 的抽样中满足；也没有任何留出期模式询问任何与精英放贷有关的事。因此分叉的第二支既在预测检验之外，也在消融集合之外。
  policy_robustness: 未测量：P12 的机制读数只有汲取、棘轮与武装集团整合这几个读数，其中没有一个读取信贷渠道。政策实验臂确实改变水平层面的比较，但没有任何读数追踪精英放贷，因此这一机制没有结论。
  historical_support: debt-transfers-land（等级 B，目标，窗口 1600-1644）：校准窗口 0.94；land-abandonment-in-famine（等级
    C，目标，窗口 1630-1644）：校准窗口 1.00；模型的利率与隐匿土地参数是相对于这些目标辨识的
  historical_challenge: 史料把中介与累积描述为不同精英作出不同选择的结果；模型只有一条放贷规则，没有掠夺性的变体，因此它无法分辨它本应在其中分叉的各支。土地转移模式以 0.94 相符，说明的是信贷关系在起作用，而不是精英发生了分化。
  counterexample: 基线运行以 0.94 满足 debt-transfers-land，同时税基收缩了 15,476 亩，土地如该模式所描述的那样流向债权人。移除信贷渠道使这一收缩更深，而不是更浅（tax_base_change_mu
    -9,539.98 [-12,523.40, -7,849.88]，下降）：中介与累积是一起出现的，而不是作为替代选项出现，因此所述的分叉并不是模型所显示的东西。
  falsifiable_prediction: 两个检验，每个主张一个。造出累积的那一支——精英以最高利率放贷，并在违约时取得土地——它应当产生比关闭信贷实验臂的 -9,540 亩更大的税基收缩；如果不是这样，这个分叉就没有第二支，这张卡应当用一句话说明这一点，而不是携带一个状态。然后按哪一面占优把运行分组，比较它们的轨迹：如果两组并不分开，中介就是一个机制，而不是一对分支。
  uncertainty: 这张卡以一个分叉命名，而证据只解决了它的一支，这就是状态为 WEAK（弱）而不是 CONDITIONAL（有条件成立）的原因：信贷是承重的，而关于精英分化为中介者与累积者、且后果不同这一主张，既未被测量，也与运行不一致——在运行中两面是一起出现的。信贷渠道还与迁徙纠缠在一起，因此看起来像信贷对税基的一部分效应，可能其实是迁徙效应；而钉住它的那个参数，是相对于该机制自身所蕴含的土地转移目标辨识的。
  citations:
  - kind: ablation
    source: outputs/experiments/p10-ablations/runs.parquet
    reading: NO_ELITE_CREDIT tax_base_change_mu -9,539.98 [-12,523.40, -7,849.88]，下降；households_departed
      +121.18 [+91.79, +400.50]，上升
  - kind: calibration
    source: outputs/calibration/p09-*/ensemble.parquet
    reading: elite_hidden_land_share 中位数 0.359 收缩 0.277；interest_rate_monthly 中位数 0.070 收缩 0.368
  - kind: counterfactual
    source: outputs/experiments/p10-ablations/runs.parquet
    reading: JOINT_NO_EXTRACTION_ESCALATION+NO_ELITE_CREDIT 同时关闭两条渠道
  - kind: hold-out
    source: outputs/calibration/p09-*/predictive_statistics.parquet
    reading: 没有任何留出模式对信贷渠道评分
  - kind: historical-support
    source: ray-huang-1974
    reading: debt-transfers-land（等级 B，目标，窗口 1600-1644）：校准窗口 0.94
- id: M005
  name: Insurgent Consolidation
  question: 随着危机推进，武装集团是否会整合为数量更少、规模更大的组织？
  status: SUPPORTED
  micro_conditions:
  - 武装集团通过吸纳县再也养不起的家户——即吸纳轨道——以及向周围人口征粮而壮大。
  - 内聚力是一个绑定的约束：一个获得口粮少于其成员所需的武装集团会失去内聚力，并可能再次失去成员。
  meso_conditions:
  - 弹压是国家对武装集团的强制触及能力，移除它会改变哪些武装集团得以存续。
  - 武装集团掠取的粮食，就是县无法评估、军队无法购买的粮食，因此武装集团的壮大与财政能力争夺同一季收成。
  causal_chain:
  - 从困顿人口与兵丁中的招募在危机年份持续进行。
  - 武装集团形成的速度快于其瓦解的速度，最大武装集团在武装人口中的份额上升，而武装集团的数量随弹压变动。
  - 武装人口变成数量更少、规模更大的组织，史料称其对粮食的需求超过了一个县所能征收的量——而本项目中没有任何产物测量过这个量。
  trigger: 弹压消退：移除强制触及能力之后，最大武装集团的份额下降，因此使武力集中的是弹压，而不是危机本身。该实验臂中武装集团数量如何变化则未定。
  macro_outcome: 武力集中于数量更少、规模更大的武装集团——在每一套声明政策中都出现，各为六次重复中的五次——同时县的税基无法同时满足军饷索取与赈济需求。
  conditions:
  - statement: 一个由困顿家户与欠饷士兵构成的招募来源。
    level: micro
    role: necessary
  - statement: 可从周围人口掠取的粮食。
    level: micro
    role: necessary
  - statement: 弱到足以让大型武装集团在自身扩张后仍然存续的弹压。
    level: meso
    role: facilitating
  - statement: 抬高武装集团必须购买的粮食价格的贸易中断。
    level: meso
    role: facilitating
  time_lag: 是在整个运行上而不是在某一月步上：P12 的读数比较的是 240 个 tick 中的起始武装集团数与最终数。没有任何产物记录最大武装集团份额见顶的月份，因此整合的速度未定。
  sensitivity_evidence: 对最大武装集团份额最大的基本效应是 reference_price_tael_per_shi、food_shi_per_soldier_month、assessed_value_tael_per_mu——参考价格、士兵的口粮与评估额——而越线计数的首位是
    temporary_share_of_adults_per_month、reference_price_tael_per_shi。两个排序只共享一个首位项，而不是三个，因此武装集团份额并不只是继承了崩溃边界的驱动因素，也没有任何武装集团专属参数居首。
  ablation_evidence: 弹压是承重的，方向也被测量：LOW_REPRESSION（largest_band_share_max -0.05 [-0.10, -0.01]，下降）降低了最大武装集团的份额，同时使武装集团数量仍未定。合并规则不承重：NO_BAND_MERGER
    产生与基线相同的合并计数（两者都是 0，期末武装集团数 5.25 对 5.25），因为整个批次中没有任何一次合并被触发。
  hold_out_evidence: many-bands-then-consolidation 在留出年份上于 0.62 的后验抽样中满足，在全运行上为 0.94；absorption-of-deserters-and-refugees
    为 0.75 的抽样。形状在整个运行上相符；留出年份的得分低于全运行。
  policy_robustness: 稳健：在 rule 0.83、utility 0.83、random 0.83 的重复中出现（P12 结论为“稳健”，3 个实验臂中的 3 个）。唯一政策依赖的部分是强度：utility
    实验臂的中位强度在三者中最高。
  historical_support: many-bands-then-consolidation（等级 B，留出期，窗口 1630-1644）：留出年份 0.62，全运行 0.94；absorption-of-deserters-and-refugees（等级
    B，目标，窗口 1628-1644）：校准窗口 0.75
  historical_challenge: 史料记载 1630 年代早期有三十来个武装集团，到 1644, 只剩一个占主导的组织，整合幅度达一个数量级；模型从五个武装集团变为三个、再变为九个，最大份额从
    0.20 升到约 0.38。方向相符，幅度则小得多，因此这张卡主张的是整合，而不是史料所描述的规模。
  counterexample: 合并实验臂：把内聚力门槛提高到最大值什么也没有改变（0 次合并，对照基线的 0 次），而整合仍然出现。不论它由什么产生，都不是模型文档所点名的合并规则。
  falsifiable_prediction: 降低内聚力门槛，使合并真正被触发，最大武装集团的份额就应当超过各声明政策所达到的最大值 0.382。如果合并被触发而份额并不上升，那么合并这一环节只是装饰，该机制的因果链应当围绕形成与瓦解重写。
  uncertainty: 模型点名的因果环节——按内聚力合并——从未真正运转过：P10 批次的每个实验臂、每个水平上都是零次合并。作为结果的整合是稳健的；它在模型内部的归因则不是，而这张卡并不同时主张结果与环节。每套政策五到六次重复足以显示存在，不足以估计强度。
  citations:
  - kind: policy-robustness
    source: outputs/experiments/p12-robustness/mechanism_readings.parquet
    reading: 在 rule 0.83、utility 0.83、random 0.83 的重复中出现；结论为稳健
  - kind: ablation
    source: outputs/experiments/p10-ablations/runs.parquet
    reading: LOW_REPRESSION largest_band_share_max -0.05 [-0.10, -0.01]，下降；NO_BAND_MERGER 合并 0 次，对照基线
      0 次
  - kind: hold-out
    source: outputs/calibration/p09-*/predictive_checks.parquet
    reading: many-bands-then-consolidation 留出期 0.62，全运行 0.94
  - kind: sensitivity
    source: outputs/experiments/p10-morris/runs.parquet
    reading: 最大武装集团份额的首位项为 reference_price_tael_per_shi、food_shi_per_soldier_month、assessed_value_tael_per_mu
  - kind: historical-support
    source: lorge-2005
    reading: many-bands-then-consolidation（等级 B，留出期，窗口 1630-1644）：留出年份 0.62
- id: M006
  name: Famine Mortality
  question: 饥饿造成的超额死亡是否会把一次歉收传递为人口损失，并由此传递为劳动力稀缺与土地弃耕？
  status: UNIDENTIFIED
  micro_conditions:
  - 一个消费跌破维生线的家户群组会失去成员，失去的多少取决于跌破的幅度与持续的时间。
  - 死者离开劳动力池，因此下一季的耕种规模更小。
  meso_conditions:
  - 赈济与信贷决定谁能达到维生线、谁不能，因此死亡率既是收成的函数，也是制度的函数。
  - 土地之所以被弃耕，是因为耕种它的家户不在了，而不只是因为他们逃离了。
  causal_chain:
  - 降水不足，继而歉收，继而价格暴涨，继而消费跌破维生线。
  - 群组成员死亡；模型不记录此类事件，也无法记录。
  - 每亩劳动力下降，耕种被放弃。
  trigger: 一个持续到家产耗尽之后的消费缺口——模型会走到这种状态，因为它记录了低于维生线的消费事件，但它通过贱卖与迁出来解决，而不是通过死亡。
  macro_outcome: 超出迁徙所能解释的人口下降，以及饥荒之后各季的劳动力短缺——这两者本项目中没有任何产物报告过。
  conditions:
  - statement: 一个其成员数会因死亡而减少的家户群组。
    level: micro
    role: necessary
  - statement: 一条在其之下的消费会以生命为代价的维生阈值。
    level: micro
    role: necessary
  - statement: 来得太晚、已无法改变结果的赈济。
    level: meso
    role: facilitating
  time_lag: 在这个模型中不可测量。史料把死亡放在饥荒当年及其之后；模型根本没有死亡时钟，而它确实显示出来的弃耕是由迁出产生的，而迁出是按月发生的。
  sensitivity_evidence: 不存在。P09 的先验表包含十三个参数，其中没有一个是死亡率或存活率；任何莫里斯轨迹与索博尔指数都无法作用于模型并不计算的量。
  ablation_evidence: 无法造出实验臂。移除死亡率会是空操作，因为没有东西可移除；这正是 NO_BAND_MERGER 实验臂为另一条规则所展示的情形：一个干预无法生效的实验臂测量的，是这条规则的不存在，而不是它的效应。
  hold_out_evidence: land-abandonment-in-famine——死亡率本应帮助产生的那个模式——在没有任何死亡率规则的情况下，通过迁出，于 1.00 的抽样中满足。因此这些模式得分无法区分一个有死亡的世界与一个没有死亡的世界。
  policy_robustness: 不适用：P12 读取三个机制，其中没有一个是人口量，因此没有任何政策实验臂产生关于死亡的证据。
  historical_support: famine-lags-harvest-failure（等级 B，约束，窗口 1628-1635）：是序列，不是水平，不予评分；land-abandonment-in-famine（等级
    C，目标，窗口 1630-1644）：校准窗口 1.00
  historical_challenge: 史料的因果序列是降水、收成、价格、饥饿、死亡——其中死亡是本项目从未实现的那一部分。模型通过另一个机制到达弃耕这一结果，因此关于死亡率的史料论证在这里完全无法检验。
  counterexample: 模型在零死亡的情况下以 1.00 满足 land-abandonment-in-famine，因此任何主张死亡对弃耕是必要的说法，都在模型内部被否证——而任何主张模型的弃耕是死亡率机制之史料证据的说法，都被模型自身的结构所否证。
  falsifiable_prediction: 加入一条在持续维生缺口下移除成员的死亡率规则，只有当模式的时点取决于劳动力稀缺时，留出期得分才应当变动：如果 famine-worst-years-1639-43
    保持在 1.00，而人口统计量发生变化，那么在这个模型中死亡率改变的是水平，而不是时点。这个检验今天无法运行，这就是状态为 UNIDENTIFIED（无法辨识）而不是 WEAK（弱）的原因。
  uncertainty: 这个空缺是结构性的，而不是经验性的：没有死亡事件、没有死亡参数、没有死亡输出，因此项目中没有任何东西原则上能够测量这一机制。P08 把它记录为一个覆盖缺口；这张卡把它记录为模型的机制集合与史料的因果链之间最大的一处单一错配。
  citations:
  - kind: historical-support
    source: chen-2024-chongzhen
    reading: famine-lags-harvest-failure（等级 B，约束，窗口 1628-1635）：是序列，不是水平，不予评分
  - kind: historical-support
    source: shaanxi-famine-gazetteers
    reading: land-abandonment-in-famine（等级 C，目标，窗口 1630-1644）：校准窗口 1.00
